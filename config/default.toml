[claude]
model = "claude-sonnet-4-6"
max_tokens = 2048

[scheduler]
morning_briefing_cron = "0 30 7 * * *"
reminder_check_cron = "0 * * * * *"
vault_sync_cron = "0 */5 * * * *"
message_ingest_prune_cron = "0 0 4 * * *"
timezone = "Europe/London"
# Calendar events in redb: chat ping N minutes before start, then at start (same cron as reminder_check).
appointment_reminders_enabled = true
appointment_reminder_advance_minutes = 30
# If Mervyn was offline past start, still notify within this many minutes after start.
appointment_start_grace_minutes = 30

[storage]
db_path = "./data/mervyn.redb"
vault_path = "./data/vault"
# Inbound delivery log: drop rows older than this many days. Use 0 or MERVYN__STORAGE__MESSAGE_INGEST_RETENTION_DAYS=0 to disable age pruning.
message_ingest_retention_days = 90
# Max rows to keep after age prune (oldest ids removed). Use 0 or MERVYN__STORAGE__MESSAGE_INGEST_KEEP_LAST=0 to disable the cap.
message_ingest_keep_last = 100000
# Pending ingest rows older than this (minutes) are marked failed and meta claims released. 0 = disable sweeper.
message_ingest_stale_pending_minutes = 30

[server]
port = 3000

[user_context]
enabled = true
situation_file = "mervyn-situation.md"
situation_max_chars = 12000

# While Mervyn is running: `git pull --ff-only` in repo_path, then vault → redb sync (picks up symlinked worklog.md).
# Default layout: sibling clone at ../mervyn-worklog (see mervyn-worklog README).
# Docker: mount that repo (e.g. to /worklog) and set MERVYN__WORKLOG_GIT__REPO_PATH=/worklog — vault symlinks
# to the host clone do not resolve inside the container otherwise. When set, Ask/briefing also read
# repo_path/worklog.md if vault worklog.md is missing or empty.
[worklog_git]
# Disabled 2026-09-15 pending a worklog rework. Re-enable with MERVYN__WORKLOG_GIT__ENABLED=true
# once the worklog source is sorted; the vault symlink expects /worklog/worklog.md in-container.
enabled = false
repo_path = "../mervyn-worklog"
remote = "origin"
branch = "main"
pull_cron = "0 */5 * * * *"

# db → Markdown write-back (see docs/two-way-vault-sync.md). Off by default: each phase of the
# two-way work ships dark and is verified from the logs before it is allowed to touch the vault.
# Markdown → db sync is unaffected and always runs. Enable with MERVYN__VAULT__WRITE_BACK_ENABLED=true.
[vault]
write_back_enabled = false
# Copy the managed files to a timestamped sibling of the vault before the first write of a run.
backup_before_first_write = true
