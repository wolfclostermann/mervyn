services:
  mervyn:
    build: .
    # Stabilises tags for pre-built images (see scripts/deploy-gcp.sh --local-build).
    image: mervyn:deploy
    restart: unless-stopped
    # Bound to loopback on the host, not 0.0.0.0: the admin routes are reachable over SSH
    # (`curl localhost:3000/...` on the box) and from nowhere else. Without this the port is
    # published nowhere at all and even /health cannot be checked from the host.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # :z — SELinux (Podman on Oracle/RHEL): allow container write to host bind mounts under $HOME.
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      RUST_LOG: mervyn=debug,tower_http=info
      # Two-way vault sync (docs/two-way-vault-sync.md). Not a secret, so it lives here rather
      # than in .env: this block survives every deploy path, whereas .env arrives either from
      # --use-local-env or from decrypting .env.enc, and the blob goes stale silently.
      # config/default.toml still ships it disabled; this turns it on for this deployment.
      MERVYN__VAULT__WRITE_BACK_ENABLED: "true"
      # Carry the vault to and from its git remote, so the laptop and phone see it. The vault
      # directory is the clone; MERVYN_VAULT_GITHUB_PAT (in .env) authenticates the push.
      MERVYN__VAULT_GIT__ENABLED: "true"
