[package]
name = "mervyn"
version = "0.1.0"
edition = "2021"
default-run = "mervyn"

[dependencies]
tokio = { version = "1", features = ["full"] }

axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc", "use-std"] }

redb = "2"

tokio-cron-scheduler = "0.10"

notify = "6"
notify-debouncer-mini = { version = "0.4", default-features = false }

config = "0.14"
dotenvy = "0.15"

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
constant_time_eq = "0.4"
bytes = "1"
fnv = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml = "0.9"
ngrok = "0.18.0"
# Explicit provider so binaries that only use ngrok (e.g. `check_ngrok`) and the main binary agree on one Rustls backend.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
tempfile = "3"
